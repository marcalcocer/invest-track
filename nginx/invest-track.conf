
location = /invest-track {
    return 301 /invest-track/;
}

# 1. BACKEND (Spring Boot)
location /invest-track/api {
    auth_request /_auth;
    auth_request_set $homeauth_mac $upstream_http_x_homeauth_mac;
    auth_request_set $homeauth_reason $upstream_http_x_homeauth_reason;
    error_page 403 = @auth_blocked;
    proxy_set_header X-HomeAuth-Mac $homeauth_mac;

    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# 2. FRONTEND (Astro)
location /invest-track/ {
    auth_request /_auth;
    auth_request_set $homeauth_mac $upstream_http_x_homeauth_mac;
    auth_request_set $homeauth_reason $upstream_http_x_homeauth_reason;
    error_page 403 = @auth_blocked;
    proxy_set_header X-HomeAuth-Mac $homeauth_mac;

    proxy_pass http://127.0.0.1:4321;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# 3. VITE/ASTRO DEV ASSETS & WEBSOCKET
location / {
    auth_request /_auth;
    auth_request_set $homeauth_mac $upstream_http_x_homeauth_mac;
    auth_request_set $homeauth_reason $upstream_http_x_homeauth_reason;
    error_page 403 = @auth_blocked;
    proxy_set_header X-HomeAuth-Mac $homeauth_mac;

    proxy_pass http://127.0.0.1:4321;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Crucial for HMR (Hot Module Replacement)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
